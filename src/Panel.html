<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#0f1720; --card:#17212b; --ink:#e7eef6; --muted:#93a4b8; --line:#2c3e50; --ok:#1b7f4e; --hot:#c62828; --z:#607d8b; --amber:#f9a825; }
    * { box-sizing: border-box; }
    body { margin:0; font:13px/1.35 "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:16px; letter-spacing:.02em; }
    .pending { color:var(--amber); font-size:11px; margin:4px 0 0; }
    .bar, .row { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px; }
    button, select, input { font:inherit; border:0; border-radius:4px; }
    button { background:#2456c4; color:#fff; padding:6px 8px; cursor:pointer; }
    button.ghost { background:#314557; }
    button.stop { background:var(--hot); }
    input, select { background:#0d1520; color:var(--ink); border:1px solid var(--line); padding:6px; }
    #estado { margin:0 12px 8px; color:var(--muted); min-height:2.6em; }
    section { margin:0 12px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
    h2 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
    .cell { background:#0d1520; border-radius:4px; padding:4px 6px; }
    .cell b { display:block; color:var(--muted); font-size:10px; font-weight:600; }
    .zz { background:var(--z); color:#fff; }
    .on { background:#1e6b45; }
    .hit { background:#1b5e20; }
    .miss { background:#8e2424; }
    .lcd { font:18px/1.2 monospace; letter-spacing:3px; background:#0b3a66; color:#fff; padding:8px; border-radius:4px; min-height:34px; }
    .pages { display:flex; flex-wrap:wrap; gap:3px; }
    .pages span { padding:2px 4px; border-radius:3px; background:#0d1520; font-size:11px; }
    .pages .in { background:#1e4d32; }
    .pages .dirty { background:#8a5a12; }
    #eventos div { margin-top:3px; padding:2px 4px; border-radius:3px; font-size:11px; }
  </style>
</head>
<body>
  <header>
    <h1>Simulador SIS-131</h1>
    <p class="pending">Nombre y logotipo pendientes de acuerdo. Esta vista lee el estado del motor.</p>
  </header>
  <div class="row">
    <select id="prog">
      <option>Arithmetic AX..DX</option>
      <option>Keyboard to LCD</option>
      <option>Scattered accesses</option>
    </select>
    <button onclick="cargar()">LOAD</button>
  </div>
  <div class="bar">
    <button onclick="step()">STEP</button>
    <button onclick="run()">RUN</button>
    <button class="stop" onclick="pause()">PAUSE</button>
    <button class="ghost" onclick="resetCpu()">RESET</button>
    <button class="ghost" onclick="clearMachine()">CLEAR</button>
    <button class="ghost" onclick="politica('FIFO')">FIFO</button>
    <button class="ghost" onclick="politica('LRU')">LRU</button>
    <button class="ghost" onclick="diagnostico()">Diagnóstico</button>
  </div>
  <div class="row">
    <input id="tecla" maxlength="8" placeholder="Tecla o ENTER">
    <button id="btnCola" onclick="enviar()">A la cola</button>
    <button class="ghost" onclick="vaciarCola()">Vaciar cola</button>
  </div>
  <div id="estado">Sin snapshot.</div>
  <section>
    <h2>CPU y ALU</h2>
    <div class="grid" id="cpu"></div>
  </section>
  <section>
    <h2>Buses, enables y palabra</h2>
    <div class="grid" id="buses"></div>
  </section>
  <section>
    <h2>Caché 8 / 8 / 32</h2>
    <div id="cache"></div>
    <div id="eventos"></div>
  </section>
  <section>
    <h2>Páginas y marcos</h2>
    <div class="pages" id="paginas"></div>
    <p id="marcos" class="pending"></p>
  </section>
  <section>
    <h2>Teclado 8 y LCD 8 dentro de F0H-FFH</h2>
    <div id="lcd" class="lcd"></div>
    <div id="teclado"></div>
  </section>
  <script>
    var token = null;
    var corriendo = false;
    function glyph(n) {
      n = Number(n) || 0;
      if (n >= 32 && n <= 126) return String.fromCharCode(n);
      return n ? "." : "·";
    }
    function caja(nombre, valor, clase) {
      return "<div class='cell " + (clase || "") + "'><b>" + nombre + "</b>" + (valor == null ? "" : valor) + "</div>";
    }
    function pintar(s) {
      if (!s) return;
      document.getElementById("estado").textContent = "Estado " + s.estado + " · política " + (s.politica || "—") + (s.pausa ? " · PAUSA" : "");
      document.getElementById("cpu").innerHTML =
        caja("AX", s.ax) + caja("BX", s.bx) + caja("CX", s.cx) + caja("DX", s.dx) +
        caja("PC", s.pc) + caja("IR", s.ir) + caja("MAR", s.mar) + caja("MDR", s.mdr) +
        caja("ZF", s.zf) + caja("CF", s.cf) + caja("SF", s.sf) + caja("ALU", s.alu && s.alu.res);
      var b = s.buses || {};
      function estilo(v) { return String(v) === "ZZ" || v === "" || v == null ? "zz" : "on"; }
      document.getElementById("buses").innerHTML =
        caja("Interno", b.interno, estilo(b.interno)) + caja("Quién", b.conductorInterno) +
        caja("Dirección", b.direccion, estilo(b.direccion)) + caja("Datos", b.datos, estilo(b.datos)) +
        caja("RD", b.rd) + caja("WR", b.wr) + caja("IO", b.io) + caja("Palabra", s.palabra || "");
      var c = s.cache || {};
      function linea(nombre, cajaNivel) {
        if (!cajaNivel) return "";
        return "<div>" + nombre + " hits " + cajaNivel.hits + " · misses " + cajaNivel.misses + " · " + cajaNivel.tasa + "%</div>";
      }
      document.getElementById("cache").innerHTML = linea("L1I 8B", c.l1i) + linea("L1D 8B", c.l1d) + linea("L2 32B", c.l2);
      var ev = s.eventos || [];
      document.getElementById("eventos").innerHTML = ev.slice(-4).map(function (e) {
        var clase = String(e).indexOf("MISS") !== -1 || String(e).indexOf("FAULT") !== -1 ? "miss" : "hit";
        return "<div class='" + clase + "'>" + e + "</div>";
      }).join("");
      var pags = s.paginas || [];
      document.getElementById("paginas").innerHTML = pags.map(function (p) {
        var clase = String(p.dirty) === "1" ? "dirty" : (String(p.p) === "1" ? "in" : "");
        return "<span class='" + clase + "'>" + p.vpn + ":" + (String(p.p) === "1" ? p.pfn : "–") + "</span>";
      }).join("");
      document.getElementById("marcos").textContent = "Elegibles " + (s.marcosElegibles || []).join(",") + " · reservado " + s.marcoReservado;
      var lcd = s.lcd && s.lcd.length ? s.lcd : [0,0,0,0,0,0,0,0];
      document.getElementById("lcd").textContent = lcd.map(glyph).join("");
      document.getElementById("teclado").textContent = "Cola F0H: " + (s.teclado || []).join(" ") + " · cursor " + (s.lcdCursor == null ? "—" : s.lcdCursor) + (s.lcdNota ? " · " + s.lcdNota : "");
    }
    function fail(err) {
      corriendo = false;
      liberarCola();
      document.getElementById("estado").textContent = String(err && err.message ? err.message : err);
    }
    function remoto(nombre, arg, ok) {
      if (typeof google === "undefined" || !google.script || !google.script.run) {
        document.getElementById("estado").textContent = "Sin Apps Script: esta vista no es la hoja.";
        return;
      }
      var run = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
      if (arg === undefined) run[nombre]();
      else run[nombre](arg);
    }
    var enviandoCola = false;
    function tomar(r) {
      if (r && r.snapshot) pintar(r.snapshot);
      if (r && r.mensaje) document.getElementById("estado").textContent = r.mensaje;
      else if (r && r.ok === false && r.reason) fail(r.reason);
      else if (r && r.reason && !r.snapshot) fail(r.reason);
    }
    function liberarCola() {
      enviandoCola = false;
      var boton = document.getElementById("btnCola");
      if (boton) boton.disabled = false;
    }
    function diagnostico() {
      remoto("diagnosticarSimulador", undefined, function (texto) {
        document.getElementById("estado").textContent = String(texto || "");
      });
    }
    function cargar() { remoto("cargarProgramaPorNombre", document.getElementById("prog").value, tomar); }
    function step() { remoto("uiStep", undefined, tomar); }
    function resetCpu() { corriendo = false; token = null; remoto("uiReset", undefined, tomar); }
    function clearMachine() { corriendo = false; token = null; remoto("uiClear", undefined, tomar); }
    function pause() { corriendo = false; remoto("uiPause", undefined, function () {}); }
    function politica(nombre) { remoto("panelPolitica", nombre, tomar); }
    function enviar() {
      if (enviandoCola) return;
      enviandoCola = true;
      var boton = document.getElementById("btnCola");
      if (boton) boton.disabled = true;
      remoto("panelEnviarTecla", document.getElementById("tecla").value || "A", function (r) {
        liberarCola();
        tomar(r);
      });
    }
    function vaciarCola() {
      remoto("panelVaciarCola", undefined, tomar);
    }
    function lote() {
      if (!corriendo || !token) return;
      remoto("uiLoteRun", token, function (r) {
        tomar(r);
        if (r && r.ok && r.continuar && corriendo) lote();
        else corriendo = false;
      });
    }
    function run() {
      if (corriendo) return;
      remoto("uiComenzarEjecucion", undefined, function (r) {
        if (!r || !r.ok) { fail(r && r.reason); return; }
        token = r.token;
        corriendo = true;
        if (r.snapshot) pintar(r.snapshot);
        lote();
      });
    }
    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run.withSuccessHandler(pintar).withFailureHandler(fail).uiSnapshot();
    }
  </script>
</body>
</html>
