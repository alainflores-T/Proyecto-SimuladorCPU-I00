<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Laboratorio</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1016; color: #e7eef6; font: 14px/1.35 "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: #121820; border-bottom: 1px solid #243044; position: sticky; top: 0; z-index: 4; }
  .p1 { background: #1565c0; } .p2 { background: #6a1b9a; } .p3 { background: #ef6c00; }
  .go { background: #2e7d32; } .pause { background: #f9a825; color: #1a1a1a; } .stop { background: #c62828; }
  .ghost { background: #1e2936; border: 1px solid #34506e; }
  .led { width: 12px; height: 12px; border-radius: 50%; background: #243044; display: inline-block; }
  .led.on { background: #7cffb2; box-shadow: 0 0 8px #7cffb2; }
  .fase { font-family: ui-monospace, monospace; color: #ffcc80; }
  #plano { position: relative; padding: 12px; }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  .layout { display: grid; grid-template-columns: minmax(280px, 360px) minmax(240px, 300px) minmax(420px, 1fr); gap: 12px; }
  .card { background: #141c27; border: 1px solid #2a3b52; border-radius: 12px; padding: 10px; position: relative; }
  h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; color: #90caf9; }
  .regs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .reg { background: #0e1622; border-radius: 8px; padding: 6px 8px; border: 1px solid #243044; }
  .reg b { display: block; color: #8eb4d6; font-size: 11px; }
  .reg span { font-family: ui-monospace, monospace; font-size: 18px; }
  .trap { margin-top: 10px; clip-path: polygon(8% 0, 92% 0, 78% 100%, 22% 100%); background: #26343f; border: 0; min-height: 118px; padding: 14px 28px 10px; text-align: center; }
  .trap .ops { display: flex; justify-content: space-between; font-family: ui-monospace, monospace; }
  .op1 { color: #a5d6a7; } .op2 { color: #90caf9; } .opr { color: #e1bee7; font-size: 18px; }
  .flags { display: flex; gap: 8px; justify-content: center; margin-top: 8px; font-size: 12px; }
  .word { font-family: ui-monospace, monospace; font-size: 11px; color: #b0bec5; word-break: break-all; }
  table.mem, table.pt { border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 10px; }
  table.mem td, table.mem th, table.pt td, table.pt th { border: 1px solid #1e3a5f; text-align: center; padding: 1px 2px; }
  table.mem td { background: #123056; color: #d6e8ff; min-width: 22px; }
  table.mem td.rd { outline: 2px solid #ffb74d; }
  table.mem td.wr { outline: 2px solid #ef9a9a; }
  table.mem th, table.pt th { color: #90caf9; background: #0e1a28; }
  .wide { grid-column: 1 / -1; overflow-x: auto; }
  .cache { display: flex; flex-wrap: wrap; gap: 8px; }
  .line { background: #0e1622; border-radius: 8px; padding: 6px; min-width: 180px; }
  .line b { color: #ce93d8; }
  .keys { display: flex; flex-wrap: wrap; gap: 4px; }
  .keys button { min-width: 36px; background: #1a2330; border: 1px solid #345; }
  .lcd { display: flex; gap: 4px; margin-top: 8px; }
  .lcd i { width: 28px; height: 36px; background: #000; color: #39ff14; font-style: normal; display: grid; place-items: center; font-family: ui-monospace, monospace; font-size: 20px; border-radius: 4px; }
  .fifo { display: flex; gap: 4px; margin-top: 6px; }
  .fifo b { width: 28px; text-align: center; background: #102033; border-radius: 4px; font-family: ui-monospace, monospace; }
  #msg { color: #ffab91; min-height: 1.2em; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <button class="p1" id="bP1">P1</button>
  <button class="p2" id="bP2">P2</button>
  <button class="p3" id="bP3">P3</button>
  <button class="go" id="bStep">Step</button>
  <button class="go" id="bRun">Run</button>
  <button class="pause" id="bPause">Pause</button>
  <button class="stop" id="bReset">Reset</button>
  <label>ms <input id="vel" type="number" min="40" max="2000" value="280" style="width:70px;background:#0e1622;color:#fff;border:1px solid #345;border-radius:6px;padding:6px"></label>
  <span class="fase" id="fase">—</span>
  <span>RD <i class="led" id="ledRd"></i> WR <i class="led" id="ledWr"></i> CK <i class="led" id="ledCk"></i> IO <i class="led" id="ledIo"></i></span>
  <span id="pausa"></span>
</div>
<div id="msg"></div>
<div id="plano">
<div class="layout">
  <section class="card" id="cpu">
    <h2>CPU</h2>
    <div class="regs" id="regs"></div>
    <p id="texto"></p>
    <div class="word" id="word"></div>
  </section>
  <section class="card" id="aluCard">
    <h2>ALU</h2>
    <div class="trap" id="alu">
      <div class="ops"><span class="op1" id="aluA">—</span><span id="aluOp"> </span><span class="op2" id="aluB">—</span></div>
      <div class="opr" id="aluR">—</div>
      <div class="flags"><span id="fz">ZF 0</span><span id="fc">CF 0</span><span id="fs">SF 0</span></div>
    </div>
  </section>
  <section class="card" id="cacheCard">
    <h2>Caché</h2>
    <div class="cache" id="cache"></div>
    <p id="rates"></p>
  </section>
  <section class="card wide" id="ramCard">
    <h2 id="ram">RAM 256 B</h2>
    <div id="ramGrid"></div>
  </section>
  <section class="card wide" id="vmCard">
    <h2 id="vm">Memoria virtual 512 B · 7 marcos paginables · marco 7 fijo</h2>
    <div id="vmGrid"></div>
    <h2 id="pt" style="margin-top:10px">Tabla de páginas</h2>
    <div id="ptGrid"></div>
  </section>
  <section class="card wide" id="ioCard">
    <h2 id="kbd">Teclado · FIFO 8 en RAM F0–F7</h2>
    <div class="keys" id="keys"></div>
    <div class="fifo" id="fifo"></div>
    <p id="cola"></p>
    <h2 id="lcd">LCD</h2>
    <div class="lcd" id="lcdRow"></div>
  </section>
</div>
<svg class="wires" id="wires"></svg>
</div>
<script>
var GEN = null, PAUSA = false, VIVO = false, ULTIMO = -1;
var NODOS = ["pc","ax","bx","cx","dx","ir","mar","mdr","alu","l1","l2","ram","vm","pt","kbd","lcd"];
var RUTAS = {
  "PC-MAR": ["pc","mar","addr"],
  "MDR-IR": ["mdr","ir","data"],
  "ALU": ["ax","alu","data"],
  "CPU-RAM": ["mar","ram","addr"],
  "RAM-CPU": ["ram","mdr","data"],
  "L1-L2-RAM": ["l1","ram","addr"],
  "RAM-VM": ["ram","vm","page"],
  "VM-RAM": ["vm","ram","page"],
  "CPU-IO": ["mdr","lcd","io"],
  "IO-CPU": ["kbd","ax","io"],
  "PT": ["pt","vm","page"]
};
var COLOR = { addr: "#4fc3f7", data: "#ffb74d", control: "#ce93d8", io: "#26c6da", page: "#81c784", z: "#607d8b" };
function $(id) { return document.getElementById(id); }
function hex2(n) { var s = (n & 255).toString(16).toUpperCase(); return s.length < 2 ? "0" + s : s; }
function pedir(nombre, arg) {
  return new Promise(function (ok, mal) {
    if (window.LAB_FIXTURE && nombre === "simLabEstado") { ok(window.LAB_FIXTURE); return; }
    if (!google || !google.script || !google.script.run) { mal("sin servidor"); return; }
    var run = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { mal(e && e.message ? e.message : e); });
    if (arg === undefined) run[nombre](); else run[nombre](arg);
  });
}
function centro(id) {
  var plano = $("plano").getBoundingClientRect();
  var n = document.querySelector('[data-node="' + id + '"]');
  if (!n) return null;
  var r = n.getBoundingClientRect();
  return { x: r.left - plano.left + r.width / 2, y: r.top - plano.top + r.height / 2 };
}
function ortho(a, b) {
  var xm = Math.round((a.x + b.x) / 2);
  return "M " + a.x + " " + a.y + " H " + xm + " V " + b.y + " H " + b.x;
}
function dibujar(rec) {
  var svg = $("wires");
  var h = $("plano").scrollHeight;
  svg.setAttribute("viewBox", "0 0 " + $("plano").clientWidth + " " + h);
  svg.setAttribute("width", $("plano").clientWidth);
  svg.setAttribute("height", h);
  var html = "";
  var id, par, a, b, activo, col, d, valor;
  for (id in RUTAS) {
    if (!RUTAS.hasOwnProperty(id)) continue;
    par = RUTAS[id];
    a = centro(par[0]); b = centro(par[1]);
    if (!a || !b) continue;
    activo = rec && rec.ruta && rec.ruta.id === id;
    col = activo ? COLOR[par[2]] : "#607d8b";
    d = ortho(a, b);
    html += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (activo ? 4 : 2) + '"' + (activo ? "" : ' stroke-dasharray="6 5" opacity="0.9"') + ' marker-end="url(#flecha)"/>';
    if (activo) {
      valor = rec.emisor + " " + rec.valor;
      html += '<circle r="5" fill="' + col + '"><animateMotion dur="0.7s" fill="freeze" path="' + d + '"/></circle>';
      html += '<text x="' + ((a.x + b.x) / 2) + '" y="' + ((a.y + b.y) / 2 - 6) + '" fill="' + col + '" font-size="11">' + valor + "</text>";
    }
  }
  svg.innerHTML = '<defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#90a4ae"/></marker></defs>' + html;
}
function tabla(bytes, cols, marca) {
  var h = "<table class='mem'><tr><th></th>";
  var c, r, i, cls;
  for (c = 0; c < cols; c++) h += "<th>" + c.toString(16).toUpperCase() + "</th>";
  h += "</tr>";
  for (r = 0; r < bytes.length / cols; r++) {
    h += "<tr><th>" + (r * cols).toString(16).toUpperCase() + "</th>";
    for (c = 0; c < cols; c++) {
      i = r * cols + c;
      cls = "";
      if (marca && marca.pa === i) cls = marca.wr ? "wr" : "rd";
      h += "<td class='" + cls + "'>" + hex2(bytes[i]) + "</td>";
    }
    h += "</tr>";
  }
  return h + "</table>";
}
function render(snap, rec) {
  if (!snap) return;
  var nombres = ["pc","ax","bx","cx","dx","ir","mar","mdr"];
  var i, html = "";
  for (i = 0; i < nombres.length; i++) {
    html += "<div class='reg' data-node='" + nombres[i] + "'><b>" + nombres[i].toUpperCase() + "</b><span>" + snap.regs[nombres[i]] + "</span></div>";
  }
  $("regs").innerHTML = html;
  $("texto").textContent = snap.texto || snap.evento || "";
  $("word").textContent = snap.bits || "";
  $("aluA").textContent = hex2(snap.alu.a);
  $("aluB").textContent = hex2(snap.alu.b);
  $("aluOp").textContent = snap.alu.op || "·";
  $("aluR").textContent = hex2(snap.alu.r);
  $("alu").setAttribute("data-node", "alu");
  $("fz").textContent = "ZF " + snap.alu.zf;
  $("fc").textContent = "CF " + snap.alu.cf;
  $("fs").textContent = "SF " + snap.alu.sf;
  $("fase").textContent = snap.fase + "  " + (snap.evento || "");
  ["Rd","Wr","Ck","Io"].forEach(function (k) {
    $("led" + k).className = "led" + (snap.control[k.toLowerCase()] ? " on" : "");
  });
  var marca = { pa: snap.marca && snap.marca.pa !== "" ? Number(snap.marca.pa) : -1, wr: snap.control.wr };
  $("ramGrid").innerHTML = tabla(snap.ram, 16, marca);
  $("ram").setAttribute("data-node", "ram");
  $("vmGrid").innerHTML = tabla(snap.swap, 32, null);
  $("vm").setAttribute("data-node", "vm");
  html = "<table class='pt'><tr><th>VPN</th><th>P</th><th>PFN</th><th>D</th><th>R</th></tr>";
  snap.pt.forEach(function (p) {
    html += "<tr><td>" + p.vpn + "</td><td>" + p.p + "</td><td>" + p.pfn + "</td><td>" + p.d + "</td><td>" + p.r + "</td></tr>";
  });
  $("ptGrid").innerHTML = html + "</table>";
  $("pt").setAttribute("data-node", "pt");
  function linea(nombre, lin) {
    return "<div class='line' data-node='" + (nombre === "L1I" || nombre === "L1D" ? "l1" : "l2") + "'><b>" + nombre + "</b> V" + lin.v + " tag " + lin.tag + "<br>" + lin.bytes.map(hex2).join(" ") + "</div>";
  }
  $("cache").innerHTML = linea("L1I", snap.l1i) + linea("L1D", snap.l1d) + snap.l2.map(function (l, n) { return linea("L2." + n, l); }).join("");
  $("rates").textContent = "L1I " + snap.rates.l1i + "  L1D " + snap.rates.l1d + "  L2 " + snap.rates.l2;
  $("fifo").innerHTML = snap.kbd.map(function (b) { return "<b>" + hex2(b) + "</b>"; }).join("");
  $("cola").textContent = "cabeza " + snap.kbdHead + "  cola " + snap.kbdTail + "  cuenta " + snap.kbdCount;
  $("lcdRow").innerHTML = (snap.lcd + "        ").slice(0, 8).split("").map(function (ch) { return "<i>" + (ch === " " ? "" : ch) + "</i>"; }).join("");
  $("kbd").setAttribute("data-node", "kbd");
  $("lcd").setAttribute("data-node", "lcd");
  if (!rec || rec.ruta.id === "High-Z") dibujar(null);
  else dibujar(rec);
}
function teclas() {
  var letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");
  letras.push("Espacio", "Borrar");
  $("keys").innerHTML = letras.map(function (t) { return "<button data-key='" + t + "'>" + t + "</button>"; }).join("");
  $("keys").onclick = function (ev) {
    var k = ev.target.getAttribute("data-key");
    if (!k || window.LAB_FIXTURE) return;
    pedir("simPulsarDesdeLab", k).then(refrescar).catch(fallo);
  };
}
function fallo(m) { $("msg").textContent = String(m || "error"); }
function refrescar() {
  return pedir("simLabEstado").then(function (p) {
    if (!p) return;
    if (GEN === null) GEN = p.gen;
    if (p.gen !== GEN) return;
    ULTIMO = p.seq;
    render(p.snap, p.rec);
  });
}
function unPaso() {
  return pedir("simLabPaso").then(function (p) {
    if (!p) return p;
    if (GEN === null) GEN = p.gen;
    if (p.gen !== GEN) return p;
    ULTIMO = p.seq;
    render(p.snap, p.rec);
    return p;
  });
}
$("bStep").onclick = function () { if (window.LAB_FIXTURE) return; unPaso().catch(fallo); };
$("bRun").onclick = function () {
  if (window.LAB_FIXTURE || VIVO) return;
  VIVO = true; PAUSA = false; $("pausa").textContent = "";
  (async function () {
    try {
      while (VIVO && !PAUSA) {
        var p = await unPaso();
        if (!p || p.gen !== GEN) break;
        if (p.fase === "HALT" || p.fase === "ERROR" || p.pausa) break;
        await new Promise(function (r) { setTimeout(r, Number($("vel").value) || 280); });
      }
    } catch (e) { fallo(e); }
    VIVO = false;
    if (PAUSA) $("pausa").textContent = "PAUSED";
  })();
};
$("bPause").onclick = function () { PAUSA = true; $("pausa").textContent = "PAUSED"; };
$("bReset").onclick = function () {
  PAUSA = true; VIVO = false;
  if (window.LAB_FIXTURE) return;
  pedir("simLabReset").then(function (p) { GEN = p.gen; ULTIMO = -1; return refrescar(); }).catch(fallo);
};
["P1","P2","P3"].forEach(function (id, n) {
  $("bP" + (n + 1)).onclick = function () {
    if (window.LAB_FIXTURE) return;
    pedir("simCargarFuente", id).then(function () { GEN = null; return refrescar(); }).catch(fallo);
  };
});
teclas();
if (window.LAB_FIXTURE) { GEN = window.LAB_FIXTURE.gen; render(window.LAB_FIXTURE.snap, window.LAB_FIXTURE.rec); }
else refrescar().catch(fallo);
window.addEventListener("resize", function () { dibujar(null); });
</script>
</body>
</html>
